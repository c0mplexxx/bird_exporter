version: 2

dist: artifacts

before:
  hooks:
    - go mod download

builds:
  - binary: bird_exporter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.revision={{ .Commit }}
        -X main.buildDate={{ .Date }}
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64

checksum:
  name_template: checksums.txt
